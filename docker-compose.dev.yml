# Development compose — runs pdf-service only.
# The database is Neon Postgres (Change 6): local dev connects to the Neon
# pooled endpoint via DATABASE_URL in .env.local, so there is no local
# postgres service to start. App runs locally via: npm run dev
# STORAGE_ROOT maps to .data/ for local file storage.
services:
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile.pdf
    environment:
      NODE_ENV: production
      INTERNAL_PDF_SECRET: ${INTERNAL_PDF_SECRET}
      INTERNAL_APP_URL: ${INTERNAL_APP_URL:-http://localhost:3000}
      STORAGE_ROOT: /data
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://localhost:3001/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
